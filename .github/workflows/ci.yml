name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Public URL of a meter photo (JPEG or PNG), same framing as the test photo"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build, fmt, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release

  read-meter:
    name: Read meter from photo
    if: github.event_name == 'workflow_dispatch' && inputs.image_url != ''
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download photo
        env:
          IMAGE_URL: ${{ inputs.image_url }}
        run: curl -fsSL --max-filesize 25000000 -o photo.jpg "$IMAGE_URL"
      - name: Run reader
        run: cargo run --release -- photo.jpg overlay.png | tee reading.txt
      - name: Summary
        run: |
          echo "### Meter reading" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat reading.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: meter-overlay
          path: overlay.png
